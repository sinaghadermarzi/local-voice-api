services:
  voice-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/cache/huggingface
    environment:
      - CHATTERBOX_URL=http://chatterbox:8001
    gpus: all
    restart: unless-stopped

  # optional second engine (Chatterbox Turbo); start with: docker compose --profile chatterbox up -d
  chatterbox:
    build: services/chatterbox
    profiles: ["chatterbox"]
    environment:
      - CHATTERBOX_VARIANT=turbo  # "standard" loads the slower 0.5B original instead
      - VOICES_DIR=/voices
    volumes:
      - hf-cache:/cache/huggingface
      - ./voices:/voices:ro       # reference clips for voice cloning: voices/<name>.wav
    gpus: all
    restart: unless-stopped

volumes:
  hf-cache:
